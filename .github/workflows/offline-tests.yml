name: Offline research checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run software tests without model credentials
        run: python -m pytest -q
      - name: Verify frozen research archive and replay saved scores
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import zipfile

          base = Path('output/research_final')
          receipt = json.loads((base / 'reproduction_receipt.json').read_text())
          archive = base / receipt['archive']
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == receipt['sha256']
          with tempfile.TemporaryDirectory() as folder:
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(folder)
              subprocess.run([sys.executable, '-m', 'scripts.verify_research_snapshot', '--rescore'],
                             cwd=folder, check=True)
          PY
